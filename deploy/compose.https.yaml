services:
  guardian-https:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      guardian:
        condition: service_started
    environment:
      GUARDIAN_DOMAIN: ${GUARDIAN_DOMAIN:?Set GUARDIAN_DOMAIN to the public DNS name}
    ports:
      - "${GUARDIAN_HTTP_REDIRECT_HOST_PORT:-80}:80"
      - "${GUARDIAN_HTTPS_HOST_PORT:-443}:443"
      - "${GUARDIAN_HTTPS_HOST_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - guardian-caddy-data:/data
      - guardian-caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  guardian-caddy-data:
    name: ${GUARDIAN_CADDY_DATA_VOLUME:-qq-guardian-caddy-data}
  guardian-caddy-config:
    name: ${GUARDIAN_CADDY_CONFIG_VOLUME:-qq-guardian-caddy-config}
