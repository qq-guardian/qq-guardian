<style>
:root{--bg:#f5f7fa;--surface:#fff;--border:#e2e8f0;--text:#1a202c;--muted:#718096;--primary:#4f7cff;--primary-dark:#3658f5;--accent:#7c3aed;--cyan:#22d3ee;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--radius:10px;--shadow:0 12px 30px rgba(43,77,255,.12);--ch1:#2a78d6;--ch2:#eb6834;--ch3:#1baf7a}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--ch1:#3987e5;--ch2:#d95926;--ch3:#199e70}
@media(prefers-color-scheme:dark){[data-theme="system"]{--bg:#0f172a;--surface:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8;--ch1:#3987e5;--ch2:#d95926;--ch3:#199e70}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;display:flex;min-height:100vh}
#sidebar{width:220px;background:linear-gradient(180deg,rgba(24,33,86,.98),rgba(10,16,43,.98));border-right:1px solid rgba(111,130,255,.25);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:10;box-shadow:18px 0 45px rgba(15,23,42,.18)}
#main{margin-left:220px;flex:1;display:flex;flex-direction:column}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 0 rgba(79,124,255,.06)}
#content{padding:24px;flex:1}
.sb-logo{display:flex;align-items:center;gap:10px;padding:16px;font-size:17px;font-weight:800;color:#fff;border-bottom:1px solid rgba(111,130,255,.22);letter-spacing:.01em}
.sb-logo img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 10px 25px rgba(55,91,255,.35)}
.sb-logo-text{display:flex;flex-direction:column;line-height:1.15}.sb-logo-sub{font-size:11px;font-weight:600;color:#93c5fd;letter-spacing:.08em;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:#a5b4fc;border-left:3px solid transparent;cursor:pointer;transition:.15s;font-size:14px}
.sb-item:hover{color:#fff;background:rgba(79,124,255,.14)}
.sb-item.active{color:#fff;border-left-color:#5ee7ff;background:linear-gradient(90deg,rgba(34,211,238,.22),rgba(124,58,237,.12))}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(111,130,255,.22);font-size:12px;color:#93c5fd}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-val{font-size:28px;font-weight:700;color:var(--primary)}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--bg);font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border-bottom:1px solid var(--border);text-align:left}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
.table-wrap{overflow-x:auto}
.form-group{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:1px solid transparent;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;color:var(--text);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{cursor:not-allowed;opacity:.5;filter:saturate(.45)}
.action-hint{display:block;margin-top:5px;max-width:260px;color:var(--muted);font-size:11px;line-height:1.35}
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600}
.badge-green{background:#dcfce7;color:#15803d}.badge-red{background:#fee2e2;color:#dc2626}
.badge-yellow{background:#fef9c3;color:#854d0e}.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-gray{background:var(--bg);color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:10px;padding:24px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{padding:10px 18px;border-radius:8px;font-size:14px;font-weight:500;color:#fff;animation:slideIn .25s ease}
.toast-success{background:#22c55e}.toast-error{background:#ef4444}.toast-info{background:#3b82f6}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
.page{display:none}.page.active{display:block}
.page-title{font-size:20px;font-weight:700;margin-bottom:20px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.health-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.health-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.health-name{font-size:13px;font-weight:600;margin-bottom:4px}
.health-detail{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.dot-green{background:var(--success)}.dot-red{background:var(--danger)}.dot-yellow{background:var(--warning)}
.brand-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;margin-bottom:24px;padding:26px;border:1px solid rgba(111,130,255,.24);border-radius:22px;color:#fff;background:radial-gradient(circle at 20% 15%,rgba(34,211,238,.35),transparent 28%),radial-gradient(circle at 84% 35%,rgba(168,85,247,.32),transparent 26%),linear-gradient(135deg,#08153f,#18266e 52%,#21145f);box-shadow:0 24px 70px rgba(31,41,142,.28)}
.brand-hero:after{content:"";position:absolute;inset:12px;border:1px solid rgba(93,231,255,.16);border-radius:18px;pointer-events:none}.brand-hero img{width:108px;height:108px;border-radius:26px;object-fit:cover;box-shadow:0 18px 45px rgba(34,211,238,.24);z-index:1}.brand-hero h2{font-size:26px;margin-bottom:6px}.brand-hero p{color:#c7d2fe;font-size:14px;max-width:720px}.brand-hero-content{position:relative;z-index:1}.brand-pill{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:12px;color:#e0f2fe}
</style>
</head>

      <div class="card" id="bot-account-card"></div>
      <div class="card">
        <div class="table-wrap"><table>
          <thead><tr>
            <th data-t="thGroupName"></th><th data-t="thMembers"></th>
            <th data-t="colProtection"></th><th data-t="colReminder"></th><th data-t="thApprovalAction"></th>
          </tr></thead>
          <tbody id="groups-tbody"></tbody>
        </table></div>
        <div style="margin-top:16px;display:flex;align-items:center;gap:10px">
          <button class="btn btn-primary" id="btn-save-all-groups" data-t="saveAllGroupsBtn"></button>
          <span style="font-size:12px;color:var(--muted)" data-t="saveAllGroupsHint"></span>
        </div>
      </div>
    </div>
    <div class="page" id="page-approval">
      <div class="section-header"><span class="page-title" data-t="pendingRequests"></span>
        <button class="btn btn-outline btn-sm" id="btn-load-approvals" data-t="refresh"></button></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr>
          <th data-t="thUser"></th><th data-t="thGroup"></th><th data-t="thComment"></th>
          <th data-t="thStatus"></th><th data-t="thTime"></th><th data-t="thActions"></th>
        </tr></thead>
        <tbody id="approval-tbody"></tbody>
      </table></div></div>
    </div>
    <div class="page" id="page-punishments">
      <div class="section-header"><span class="page-title" data-t="punishmentsTitle"></span>
        <button class="btn btn-primary btn-sm" id="btn-open-punish-modal" data-t="punishBtn"></button></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr>
          <th data-t="thUser"></th><th data-t="thGroup"></th><th data-t="thType"></th>
          <th data-t="thReason"></th><th data-t="thTime"></th><th data-t="thActions"></th>
        </tr></thead>
        <tbody id="punishments-tbody"></tbody>
      </table></div></div>
    </div>
    <div class="page" id="page-blacklist">
      <div class="section-header"><span class="page-title" data-t="blacklistTitle"></span>
        <button class="btn btn-danger btn-sm" id="btn-open-blacklist-modal" data-t="addBtn"></button></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr>
          <th data-t="thUser"></th><th data-t="thGroup"></th><th data-t="thReason"></th>
          <th data-t="thAdded"></th><th data-t="thActions"></th>
        </tr></thead>
        <tbody id="blacklist-tbody"></tbody>
      </table></div></div>
    </div>
    <div class="page" id="page-risk">
      <div class="section-header"><span class="page-title" data-t="riskTitle"></span>
        <button class="btn btn-primary btn-sm" id="btn-open-rule-modal" data-t="addRuleBtn"></button></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr>
          <th data-t="thName"></th><th data-t="thPattern"></th>
          <th data-t="thRuleAction"></th><th data-t="thActive"></th><th data-t="thOps"></th>
        </tr></thead>
        <tbody id="risk-tbody"></tbody>
      </table></div></div>
    </div>
    <div class="page" id="page-audit">
      <div class="section-header"><span class="page-title" data-t="auditTitle"></span>
        <button class="btn btn-outline btn-sm" id="btn-load-audit">↻</button></div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th data-t="thAction"></th><th data-t="thActor"></th><th data-t="thTarget"></th><th data-t="thTime"></th></tr></thead>
        <tbody id="audit-tbody"></tbody>
      </table></div></div>
    </div>
    <div class="page" id="page-monitor">
      <div class="page-title" data-t="healthMonitor"></div>
      <div class="health-grid" id="health-grid"></div>
    </div>
    <div class="page" id="page-update">
      <div class="page-title" data-t="updates"></div>
      <div class="card" id="update-info"></div>
    </div>
    <div class="page" id="page-statistics">
      <div class="page-title" data-t="statisticsTitle"></div>
      <div class="stats-grid" id="stats-grid2"></div>
      <div class="card">
        <div class="card-title" data-t="trendTitle"></div>
        <div id="trend-legend" style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-bottom:10px"></div>
        <div id="trend-chart" style="position:relative"></div>
        <details style="margin-top:12px">
          <summary style="cursor:pointer;font-size:13px;color:var(--muted)" data-t="trendTableToggle"></summary>
          <div class="table-wrap" style="max-height:260px;overflow-y:auto;margin-top:8px"><table>
            <thead><tr><th data-t="thDate"></th><th data-t="trendApprovals"></th><th data-t="trendRisk"></th><th data-t="trendPunish"></th></tr></thead>
            <tbody id="trend-tbody"></tbody>
          </table></div>
        </details>
      </div>
    </div>
    <div class="page" id="page-settings">
      <div class="page-title" data-t="settingsTitle"></div>
      <div class="card">
        <div class="form-group"><label data-t="botSelfId"></label><input type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" id="cfg-selfid"/></div>
        <hr>
        <div class="form-group"><label data-t="detectorActionsLabel"></label>
          <div id="detector-actions" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px"></div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px" data-t="detectorActionsHint"></div></div>
        <div class="form-group"><label data-t="muteDurationLabel"></label><input type="number" id="cfg-mute-duration" min="60" step="60"/></div>
        <div class="form-group"><label data-t="aiMinScoreLabel"></label><input type="number" id="cfg-ai-min" min="0" max="100"/>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="aiMinScoreHint"></div></div>
        <div class="form-group">
          <label style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" id="cfg-recall" style="width:auto"/> <span data-t="recallLabel"></span></label>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="recallHint"></div></div>
        <div class="form-group">
          <label style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" id="cfg-builtin-reject" style="width:auto"/> <span data-t="builtinRejectLabel"></span></label>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="builtinRejectHint"></div></div>
        <div class="form-group">
          <label style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" id="cfg-builtin-approve" style="width:auto"/> <span data-t="builtinApproveLabel"></span></label>
          <div style="font-size:12px;color:var(--danger);margin-top:4px" data-t="builtinApproveHint"></div></div>
        <div class="form-group">
          <label style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" id="cfg-intel-enabled" style="width:auto"/> <span data-t="intelEnabledLabel"></span></label>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="intelEnabledHint"></div></div>
        <hr>
        <div class="form-group">
          <label style="display:inline-flex;align-items:center;gap:8px"><input type="checkbox" id="cfg-commands-enabled" style="width:auto"/> <span data-t="commandsEnabledLabel"></span></label>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="commandsHint"></div></div>
        <div class="form-group"><label data-t="commandPrefixLabel"></label><input type="text" id="cfg-command-prefix" placeholder="/guard"/></div>
        <hr>
        <div class="form-group"><label data-t="timezoneLabel"></label><input type="text" id="cfg-timezone" placeholder="Asia/Shanghai"/>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="timezoneHint"></div></div>
        <hr>
        <div class="form-group"><label data-t="githubRepoLabel"></label><input type="text" id="cfg-githubrepo" placeholder="owner/repo"/>
          <div style="font-size:12px;color:var(--muted);margin-top:4px" data-t="githubRepoHint"></div></div>
        <button class="btn btn-primary" id="btn-save-config" data-t="saveSettings"></button>
      </div>
    </div>
    <div class="page" id="page-users">
      <div class="section-header">
        <span class="page-title" data-t="usersTitle"></span>
        <button class="btn btn-primary btn-sm" id="btn-create-user" data-t="createUserBtn"></button>
      </div>
      <div class="card">
        <table>
          <thead><tr>
            <th data-t="thId"></th>
            <th data-t="thUsername"></th>
            <th data-t="thRole"></th>
            <th data-t="thStatus"></th>
            <th data-t="thActions"></th>
          </tr></thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<!-- Login overlay — shown when no valid token is present -->
<div class="overlay open" id="login-overlay" style="background:rgba(0,0,0,.55);z-index:200">
  <div class="modal" style="max-width:360px">
    <div class="modal-title">🛡️ QQ Guardian — 登录 / Login</div>
    <div style="padding:4px 0 12px">
      <div class="form-group"><label>用户名 Username</label><input id="login-user" type="text" value="admin" autocomplete="username"/></div>
      <div class="form-group"><label>密码 Password</label><input id="login-pass" type="password" autocomplete="current-password"/></div>
      <div id="login-err" style="color:var(--danger);font-size:13px;min-height:18px"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="login-btn">登录 Login</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="../files/static/release-view.js"></script>
<script src="../files/static/user-security.js"></script>
<script src="../files/static/app.js"></script>
</body>
</html>
