name: GitHub Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run test:tooling
      - run: pnpm run verify:ci-governance
  validate-release:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected" || {
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $expected"
            exit 1
          }
  windows:
    needs: validate-release
    uses: ./.github/workflows/package-windows.yml
  linux:
    needs: validate-release
    uses: ./.github/workflows/package-linux.yml
  release:
    needs: [preflight, validate-release, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Build NapCat plugin asset
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec node scripts/package.mjs
      - name: Validate assets
        run: |
          ls release/*.zip >/dev/null
          ls release/*.tar.gz >/dev/null
          sha256sum release/*.zip release/*.tar.gz > release/SHA256SUMS.txt
      - name: Generate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release/*.zip
            release/*.tar.gz
            release/*.sha256
            release/SHA256SUMS.txt
          generate_release_notes: true
