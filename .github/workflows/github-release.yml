name: GitHub Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected" || {
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $expected"
            exit 1
          }
  windows:
    needs: validate-release
    uses: ./.github/workflows/package-windows.yml
  linux:
    needs: validate-release
    uses: ./.github/workflows/package-linux.yml
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      - name: Validate assets
        run: |
          ls release/*.zip >/dev/null
          ls release/*.tar.gz >/dev/null
          sha256sum release/*.zip release/*.tar.gz > release/SHA256SUMS.txt
      - name: Generate provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
          generate_release_notes: true
