name: Release request

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment for the focused version PR
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      expected_sha:
        description: Exact synchronized main commit approved by the maintainer
        required: true
        type: string

permissions: {}

concurrency:
  group: release-request
  cancel-in-progress: false

jobs:
  version-pr:
    name: version-pr
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out synchronized main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse a concurrent version request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_count="$(gh pr list --state open --limit 100 --json headRefName --jq \
            '[.[] | select(.headRefName | startswith("release/version-"))] | length')"
          if [[ "$open_count" != 0 ]]; then
            echo "An open release/version-* pull request already exists" >&2
            exit 1
          fi

      - name: Prepare exact version metadata
        env:
          BUMP: ${{ inputs.bump }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_sha must be a complete lowercase commit SHA' >&2
            exit 1
          fi
          pnpm run release:prepare -- "--bump=$BUMP" "--expected-sha=$EXPECTED_SHA"

      - name: Rebuild committed NapCat output
        run: pnpm run build

      - name: Verify version manifests and focused tests
        run: |
          pnpm run verify:manifests
          pnpm run test:tooling
          git diff --check

      - name: Read requested version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Require an event-producing release token
        env:
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
        run: |
          if [[ -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            echo "RELEASE_AUTOMATION_TOKEN must be a GitHub App or PAT token; GITHUB_TOKEN cannot trigger downstream release workflows" >&2
            exit 1
          fi

      - name: Create or update focused version PR
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          branch: release/version-${{ steps.version.outputs.value }}
          delete-branch: true
          commit-message: "chore(release): v${{ steps.version.outputs.value }}"
          title: "chore(release): v${{ steps.version.outputs.value }}"
          body: |
            Automated focused version update requested from `${{ inputs.expected_sha }}`.

            The release is published only after this PR passes every required CI gate and merges.
          labels: area:release,type:build

      - name: Enable merge after required checks
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PR_URL"
