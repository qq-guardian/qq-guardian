name: Native Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect native sources
        id: detect
        shell: bash
        run: |
          if find . -path './node_modules' -prune -o -path './.git' -prune -o -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' -o -name 'CMakeLists.txt' \) -print -quit | grep -q .; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify native policy
        run: |
          if [ "${{ steps.detect.outputs.required }}" = "true" ]; then
            echo "Native sources detected; no declared native build target exists."
            exit 1
          fi
          echo "No native components are present. No artificial native build is performed."
