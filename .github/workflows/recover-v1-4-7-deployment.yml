name: Recover v1.4.7 deployment

on:
  push:
    branches:
      - main

permissions:
  attestations: write
  contents: write
  deployments: write
  id-token: write
  packages: write

jobs:
  promote-v1-4-7:
    name: promote-v1.4.7
    uses: ./.github/workflows/deploy.yml
    with:
      tag: v1.4.7
      source_sha: 0ef94cedaf5a1aa76afd31e0e0a002fd3b3da75f
    secrets: inherit
