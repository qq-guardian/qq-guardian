name: Recover v1.4.4 deployment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: recover-v1-4-4
  cancel-in-progress: false

jobs:
  verify-recovery-merge:
    name: verify-v1.4.4-recovery-merge
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.verify.outputs.should_deploy }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify CI completed for the actual PR #8 merge commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          should_deploy=false
          read -r merged_at merge_sha < <(
            gh api "repos/$REPO/pulls/8" --jq '[.merged_at, .merge_commit_sha] | @tsv'
          )

          if [[ "$merged_at" != "null" && "$merge_sha" == "$HEAD_SHA" ]]; then
            should_deploy=true
            echo "PR #8 is merged and its merge commit matches the completed CI SHA: $HEAD_SHA"
          else
            echo "This CI run is not the PR #8 merge commit; no recovery deployment will run."
            echo "CI head SHA: $HEAD_SHA"
            echo "PR #8 merged_at: $merged_at"
            echo "PR #8 merge_commit_sha: $merge_sha"
          fi

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

  redeploy:
    name: redeploy-v1-4.4
    needs: verify-recovery-merge
    if: needs.verify-recovery-merge.outputs.should_deploy == 'true'
    permissions:
      attestations: write
      contents: write
      deployments: write
      id-token: write
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: v1.4.4
      source_sha: 083c31305bfbabc15eabd5f3131fe1117eede810
    secrets: inherit

  cleanup:
    name: remove-recovery-workflow
    needs: redeploy
    if: needs.redeploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove one-time recovery workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PATH_TO_DELETE: .github/workflows/recover-v1-4-4-deployment.yml
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/contents/$PATH_TO_DELETE?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$REPO/contents/$PATH_TO_DELETE"             -f message="chore(ci): remove one-time v1.4.4 recovery workflow"             -f sha="$sha"             -f branch=main
