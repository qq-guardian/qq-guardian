name: Package Linux
on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact:
        description: Linux release artifact name
        value: ${{ jobs.package.outputs.artifact }}
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec node scripts/package-production.mjs --platform=linux-x64 --runtime="$(command -v node)"
      - run: pnpm exec node scripts/verify-production-package.mjs --directory=release
      - id: meta
        run: echo "artifact=linux-release" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: release/*
          if-no-files-found: error
          retention-days: 1
