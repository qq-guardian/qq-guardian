name: Package Linux
on:
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      artifact:
        description: Linux release artifact name
        value: ${{ jobs.package.outputs.artifact }}
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            artifact: linux-x64-release
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            artifact: linux-arm64-release
    runs-on: ${{ matrix.runner }}
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec node scripts/package-production.mjs --platform=${{ matrix.platform }} --runtime="$(command -v node)"
      - run: pnpm exec node scripts/verify-production-package.mjs --directory=release
      - id: meta
        run: echo "artifact=${{ matrix.artifact }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 1
