name: Package Linux
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            artifact: linux-x64-release
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64-release
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec node scripts/package-production.mjs --platform=${{ matrix.platform }} --runtime="$(command -v node)"
      - run: pnpm exec node scripts/verify-production-package.mjs --directory=release
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 1
